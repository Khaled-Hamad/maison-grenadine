<text x="50" y="74" fill="#182234" font-size="32" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Professional knowledge portal</text>
<text x="50" y="114" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Concept / process map • read across the top row, then back along the bottom row</text>
<text x="68" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Permitted corpus</text>
<text x="68" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Start with permitted evidence</text>
<text x="493" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Extract + version</text>
<text x="493" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Make assumptions explicit</text>
<text x="918" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Retrieve scoped passages</text>
<text x="918" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Record the version</text>
<text x="918" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Draft with references</text>
