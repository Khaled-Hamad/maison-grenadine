<text x="50" y="74" fill="#182234" font-size="32" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Approval-based operations automation</text>
<text x="50" y="114" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Reference architecture • component responsibilities, not a deployed implementation</text>
<text x="68" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Permitted source</text>
<text x="68" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">External: Approved form/email connector</text>
<text x="493" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Workflow engine</text>
<text x="493" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Server: Validation, deduplication, state</text>
<text x="493" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">and bounded retries</text>
<text x="918" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Model service</text>
<text x="918" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Vendor: Draft only; minimum permitted</text>
<text x="918" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">input</text>
<text x="918" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Human reviewer</text>
<text x="918" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Human: Approves exact</text>
<text x="918" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">recipient/content/action</text>
<text x="493" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Destination</text>
<text x="493" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">External: Task record or approved</text>
<text x="493" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">external message</text>
<text x="68" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Operations owner</text>
<text x="68" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Human: Errors, spend, retention and stop</text>
<text x="68" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">control</text>
<text x="50" y="654" fill="#806226" font-size="14" font-weight="600" font-family="Segoe UI,Arial,sans-serif">CONNECTIONS / WHAT MOVES</text>
<text x="50" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E1 Permitted source -&gt; Workflow engine: event + identifier</text>
<text x="670" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E2 Workflow engine -&gt; Model service: validated drafting input</text>
<text x="50" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E3 Model service -&gt; Workflow engine: untrusted draft</text>
<text x="670" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E4 Workflow engine -&gt; Human reviewer: exact proposed action</text>
<text x="50" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E5 Human reviewer -&gt; Workflow engine: approve / deny</text>
<text x="670" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E6 Workflow engine -&gt; Destination: approved idempotent write</text>
<text x="50" y="887" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E7 Workflow engine -&gt; Operations owner: visible state / failure</text>
<text x="50" y="974" fill="#3D4A63" font-size="13" font-family="Segoe UI,Arial,sans-serif">TEACHING REFERENCE • HUMAN REVIEW AND REAL APPROVAL REMAIN REQUIRED</text>
</svg>