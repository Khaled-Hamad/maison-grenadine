<text x="50" y="74" fill="#182234" font-size="32" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Professional knowledge portal</text>
<text x="50" y="114" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Reference architecture • component responsibilities, not a deployed implementation</text>
<text x="68" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Authorised reader</text>
<text x="68" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Client: Question and permitted identity</text>
<text x="493" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Portal / workspace</text>
<text x="493" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Service: Reader access and response</text>
<text x="493" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">interface</text>
<text x="918" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Scoped retrieval</text>
<text x="918" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Server: Filter authorised current sources</text>
<text x="918" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">before generation</text>
<text x="918" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Document store</text>
<text x="918" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Content: Versioned corpus and metadata</text>
<text x="493" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Model service</text>
<text x="493" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Vendor: Separately approved inference</text>
<text x="493" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">where required</text>
<text x="68" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Corpus owner</text>
<text x="68" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Human: Updates, removal, corrections</text>
<text x="68" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">and review</text>
<text x="50" y="654" fill="#806226" font-size="14" font-weight="600" font-family="Segoe UI,Arial,sans-serif">CONNECTIONS / WHAT MOVES</text>
<text x="50" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E1 Authorised reader -&gt; Portal / workspace: question</text>
<text x="670" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E2 Portal / workspace -&gt; Scoped retrieval: question + access scope</text>
<text x="50" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E3 Scoped retrieval -&gt; Document store: authorised search</text>
<text x="670" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E4 Scoped retrieval -&gt; Model service: relevant permitted passages</text>
<text x="50" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E5 Model service -&gt; Portal / workspace: answer + references</text>
<text x="670" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E6 Corpus owner -&gt; Document store: source lifecycle</text>
<text x="50" y="887" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E7 Portal / workspace -&gt; Corpus owner: feedback / correction</text>
<text x="50" y="974" fill="#3D4A63" font-size="13" font-family="Segoe UI,Arial,sans-serif">TEACHING REFERENCE • HUMAN REVIEW AND REAL APPROVAL REMAIN REQUIRED</text>
</svg>