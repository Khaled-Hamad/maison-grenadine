<title id="title">Approval-based operations automation</title><desc id="description">Reference architecture • component responsibilities, not a deployed implementation. Permitted source: External: Approved form/email connector; Workflow engine: Server: Validation, deduplication, state and bounded retries; Model service: Vendor: Draft only; minimum permitted input; Human reviewer: Human: Approves exact recipient/content/action; Destination: External: Task record or approved external message; Operations owner: Human: Errors, spend, retention and stop control</desc>
