<text x="50" y="74" fill="#182234" font-size="32" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Small business application</text>
<text x="50" y="114" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Reference architecture • component responsibilities, not a deployed implementation</text>
<text x="68" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">User browser</text>
<text x="68" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Client: UI only; no service secrets</text>
<text x="493" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Authentication</text>
<text x="493" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Service: Approved identity/session</text>
<text x="493" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">provider</text>
<text x="918" y="223" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Application service</text>
<text x="918" y="251" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Server: Validate input; enforce role and</text>
<text x="918" y="272" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">ownership</text>
<text x="918" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Database / storage</text>
<text x="918" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Server: Record access rules; backup and</text>
<text x="918" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">restore</text>
<text x="493" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Optional model API</text>
<text x="493" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Vendor: Server-side request; separate</text>
<text x="493" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">billing</text>
<text x="68" y="508" fill="#182234" font-size="21" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Owner + monitoring</text>
<text x="68" y="536" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Human: Release approval, errors,</text>
<text x="68" y="557" fill="#3D4A63" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif">budget, rollback</text>
<text x="50" y="654" fill="#806226" font-size="14" font-weight="600" font-family="Segoe UI,Arial,sans-serif">CONNECTIONS / WHAT MOVES</text>
<text x="50" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E1 User browser -&gt; Authentication: sign in</text>
<text x="670" y="689" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E2 User browser -&gt; Application service: authorised request</text>
<text x="50" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E3 Authentication -&gt; Application service: verified identity</text>
<text x="670" y="755" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E4 Application service -&gt; Database / storage: permitted data operation</text>
<text x="50" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E5 Application service -&gt; Optional model API: optional approved inference</text>
<text x="670" y="821" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E6 Application service -&gt; Owner + monitoring: redacted events</text>
<text x="50" y="887" fill="#3D4A63" font-size="14" font-weight="400" font-family="Segoe UI,Arial,sans-serif">E7 Owner + monitoring -&gt; Application service: release / stop decision</text>
<text x="50" y="974" fill="#3D4A63" font-size="13" font-family="Segoe UI,Arial,sans-serif">TEACHING REFERENCE • HUMAN REVIEW AND REAL APPROVAL REMAIN REQUIRED</text>
</svg>