<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1014" viewBox="0 0 1280 1014" role="img" aria-labelledby="title description">
<title id="title">Integrated creator delivery portal</title><desc id="description">Reference architecture • component responsibilities, not a deployed implementation. Client portal: Client: No provider secrets; project/asset UI; Application service: Server: Authenticate, authorise, validate and enforce budget; Database + storage: Server: Scoped records, asset versions and signed access; Media providers: Vendor: Higgsfield / ElevenLabs with separately approved API access; Job processor: Server: Verified callbacks, deduplication, bounded polling and truthful states; Client + operator: Human: Rights review, exact-version approval and stop decisions</desc>
