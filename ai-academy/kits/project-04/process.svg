<title id="title">Professional knowledge portal</title><desc id="description">Concept / process map • read across the top row, then back along the bottom row. Permitted corpus: Start with permitted evidence; Extract + version: Make assumptions explicit; Retrieve scoped passages: Record the version; Draft with references: Inspect actual behaviour; Support / abstention checks: Do not replace review with confidence; Approved portal + updates: Retain the evidence and limits</desc>
