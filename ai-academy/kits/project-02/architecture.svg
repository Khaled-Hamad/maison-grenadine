<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1014" viewBox="0 0 1280 1014" role="img" aria-labelledby="title description">
<title id="title">Small business application</title><desc id="description">Reference architecture • component responsibilities, not a deployed implementation. User browser: Client: UI only; no service secrets; Authentication: Service: Approved identity/session provider; Application service: Server: Validate input; enforce role and ownership; Database / storage: Server: Record access rules; backup and restore; Optional model API: Vendor: Server-side request; separate billing; Owner + monitoring: Human: Release approval, errors, budget, rollback</desc>
