<title id="title">Professional knowledge portal</title><desc id="description">Reference architecture • component responsibilities, not a deployed implementation. Authorised reader: Client: Question and permitted identity; Portal / workspace: Service: Reader access and response interface; Scoped retrieval: Server: Filter authorised current sources before generation; Document store: Content: Versioned corpus and metadata; Model service: Vendor: Separately approved inference where required; Corpus owner: Human: Updates, removal, corrections and review</desc>
